services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: normex
      POSTGRES_USER: normex
      POSTGRES_PASSWORD: normex
    ports:
      - "5432:5432"
    volumes:
      - normex_pg:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://normex:normex@postgres:5432/normex
      SECRET_KEY: change-this-in-development
      CORS_ORIGINS: http://localhost:5173
      STORAGE_PATH: /app/storage
      LLM_PROVIDER: none
      EMBEDDING_MODEL: none
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  normex_pg:
